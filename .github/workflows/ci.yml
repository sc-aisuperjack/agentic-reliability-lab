name: Spec-driven quality gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Versioned acceptance tests
        run: PYTHONPATH=. python -c 'from app.evaluations import run_evaluations; r=run_evaluations(); assert r.failed == 0, r.model_dump(); print(r.total, "passing scenarios")'
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
  specification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -s intent/reliable-support/intent.md
          test -s intent/reliable-support/spec.md
          test -s intent/reliable-support/plan.md
          test -s docs/adr/001-deterministic-baseline.md
          grep -q REQ-001 intent/reliable-support/spec.md
          grep -q REQ-006 intent/reliable-support/spec.md
