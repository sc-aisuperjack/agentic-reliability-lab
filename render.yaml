# Review the actual plan in Render before approving service creation.
services:
  - type: web
    name: agentic-reliability-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CORS_ORIGINS
        value: https://agentic-reliability-lab.onrender.com
  - type: web
    name: agentic-reliability-lab
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://agentic-reliability-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
